plugins {
    id 'com.android.application'
}

android {
    namespace 'com.btechcse.secd.timetable'
    compileSdk 36

    defaultConfig {
        applicationId "com.btechcse.secd.timetable"
        minSdk 24
        targetSdk 34
        versionCode 33
        versionName "5.3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ""
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external dependencies needed; WebView is part of standard Android framework!
}
